x-common-env: &common-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  SPRING_DATA_REDIS_HOST: redis

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qflow
      POSTGRES_PASSWORD: qflow
      POSTGRES_DB: postgres
    ports: [ "5432:5432" ]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U qflow -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: [ "6379:6379" ]

  kafka:
    image: apache/kafka:3.8.0
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  eureka-server:
    profiles: [ "apps" ]
    build: { context: ., args: { MODULE: eureka-server } }
    ports: [ "8761:8761" ]

  api-gateway:
    profiles: [ "apps" ]
    build: { context: ., args: { MODULE: api-gateway } }
    ports: [ "8080:8080" ]
    environment: *common-env
    depends_on: [ eureka-server ]

  auth-service:
    profiles: [ "apps" ]
    build: { context: ., args: { MODULE: auth-service } }
    ports: [ "8081:8081" ]
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_started }

  queue-service:
    profiles: [ "apps" ]
    build: { context: ., args: { MODULE: queue-service } }
    ports: [ "8082:8082" ]
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/queue_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_started }
      kafka: { condition: service_started }
      redis: { condition: service_started }

  appointment-service:
    profiles: [ "apps" ]
    build: { context: ., args: { MODULE: appointment-service } }
    ports: [ "8083:8083" ]
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appointment_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_started }

  notification-service:
    profiles: [ "apps" ]
    build: { context: ., args: { MODULE: notification-service } }
    ports: [ "8084:8084" ]
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_started }
      kafka: { condition: service_started }

volumes:
  pgdata:
